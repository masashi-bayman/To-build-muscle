# /etc/nginx/snippets/training.conf にコピーし、既存の server {} 内に
#   include snippets/training.conf;
# を1行足して使う（/training/ 配下で公開）
location /training/ {
    alias /opt/training-log/public/;
    index index.html;
    try_files $uri $uri/ /training/index.html;
    add_header Cache-Control "no-cache";
}
location /training/api/ {
    proxy_pass http://127.0.0.1:8765/api/;
    proxy_set_header Host $host;
    client_max_body_size 128k;
}
